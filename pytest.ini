[pytest]
# SAURON Test Configuration

# Async mode per pytest-asyncio
asyncio_mode = auto

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output verbosity
addopts = -v --tb=short

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Markers
markers =
    asyncio: mark test as async
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that require real firewall connection
